<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Meme Slider</title>
</head>

<body>
    <div class="wrapper">
        <div class="slider_img">
            <div class="image_item"><img id="image1" src="assets/img/image1.jpg" alt="Image1"></div>
            <div class="image_item"><img id="image2" src="assets/img/image2.jpg" alt="Image2"></div>
            <div class="image_item"><img id="image3" src="assets/img/image3.jpg" alt="Image3"></div>
            <div class="image_item"><img id="image4" src="assets/img/image4.jpg" alt="Image4"></div>
            <div class="image_item"><img id="image5" src="assets/img/image5.jpg" alt="Image5"></div>
            <div class="image_item"><img id="image6" src="assets/img/image6.jpg" alt="Image6"></div>
            <div class="image_item"><img id="image7" src="assets/img/image7.jpg" alt="Image7"></div>
            
        </div>
        <div class="controls_content">
            <div class="controls_content_text">
                <div class="text_item" id="phrase1">
                    <h2>The monday is comming</h2>
                </div>
                <div class="text_item" id="phrase2">
                    <h2>Need work</h2>
                </div>
                <div class="text_item" id="phrase3">
                    <h2>Working process better at home</h2>
                </div>
                <div class="text_item" id="phrase4">
                    <h2>Release time...Ups..</h2>
                </div>
                <div class="text_item" id="phrase5">
                    <h2>Manager try to find out positive moments</h2>
                </div>
                <div class="text_item" id="phrase6">
                    <h2>Support of colleague</h2>
                </div>
                <div class="text_item" id="phrase7">
                    <h2>Show must go on</h2>
                </div>

            </div>
            <div class="controls_content_item">
                <div class="control_item"><a href="#image1" class="control_round"></a></div>
                <div class="control_item"><a href="#image2" class="control_round"></a></div>
                <div class="control_item"><a href="#image3" class="control_round"></a></div>
                <div class="control_item"><a href="#image4" class="control_round"></a></div>
                <div class="control_item"><a href="#image5" class="control_round"></a></div>
                <div class="control_item"><a href="#image6" class="control_round"></a></div>
                <div class="control_item"><a href="#image7" class="control_round"></a></div>
            </div>
        </div>
    </div>
</body>

</html>
