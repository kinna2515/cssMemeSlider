<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Meme Slider</title>
</head>

<body>
    <div class="wrapper">
        <div class="slider_img">
            <div class="image_item"><img id="image1" src="assets/img/image1.jpg" alt="Image1"></div>
            <div class="image_item"><img id="image2" src="assets/img/image2.jpg" alt="Image2"></div>
            <div class="image_item"><img id="image3" src="assets/img/image3.jpg" alt="Image3"></div>
            <div class="image_item"><img id="image4" src="assets/img/image4.jpg" alt="Image4"></div>
            <div class="image_item"><img id="image5" src="assets/img/image5.jpg" alt="Image5"></div>
            <div class="image_item"><img id="image6" src="assets/img/image6.jpg" alt="Image6"></div>
            <div class="image_item"><img id="image7" src="assets/img/image7.jpg" alt="Image7"></div>

        </div>
        <div class="controls_content">
            <div class="controls_content_text">
                <input type="radio" id="control1" name="control">
                <div class="text_item">
                    <h2>The monday is comming</h2>
                </div>

                <input type="radio" id="control2" name="control">
                <div class="text_item">
                    <h2>Need work</h2>
                </div>

                <input type="radio" id="control3" name="control">
                <div class="text_item">
                    <h2>Working process better at home</h2>
                </div>

                <input type="radio" id="control4" name="control">
                <div class="text_item">
                    <h2>Release time...Ups..</h2>
                </div>

                <input type="radio" id="control5" name="control">
                <div class="text_item">
                    <h2>Manager try to find out positive moments</h2>
                </div>

                <input type="radio" id="control6" name="control">
                <div class="text_item">
                    <h2>Support of colleague</h2>
                </div>

                <input type="radio" id="control7" name="control">
                <div class="text_item">
                    <h2>Show must go on</h2>
                </div>

            </div>
            <div class="controls_content_item">

                <div class="control_item"><a href="#image1" class="control_round_img"></a>
                    <label for="control1" class="control_round"></label>
                </div>
                <div class="control_item"><a href="#image2" class="control_round_img"></a>
                    <label for="control2" class="control_round"></label>
                </div>
                <div class="control_item"><a href="#image3" class="control_round_img"></a>
                        <label for="control3" class="control_round"></label>
                    </div>
                <div class="control_item"><a href="#image4" class="control_round_img"></a>
                    <label for="control4" class="control_round"></label>
                </div>
                <div class="control_item"><a href="#image5" class="control_round_img"></a>
                    <label for="control5" class="control_round"></label>
                </div>
                <div class="control_item"><a href="#image6" class="control_round_img"></a>
                    <label for="control6" class="control_round"></label>
                </div>
                <div class="control_item"><a href="#image7" class="control_round_img"></a>
                    <label for="control7" class="control_round"></label>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
